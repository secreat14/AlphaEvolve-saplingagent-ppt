<section class="speech-controls" aria-label="讲稿配音播放器">
  <div class="speech-controls-top">
    <div class="speech-player-title">微软语音配音 <span lang="en">Microsoft voices</span></div>
    <label class="speech-rate-label" for="speech-rate">播放速度 <select id="speech-rate"><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option></select></label>
    <label class="speech-repeat-label"><input id="speech-repeat" type="checkbox"> 单句循环</label>
  </div>
  <div class="speech-actions">
    <button type="button" data-speech-mode="en">▶ 英文全文</button>
    <button type="button" data-speech-mode="zh-CN">▶ 中文全文</button>
    <button type="button" data-speech-mode="both">▶ 中英对照</button>
    <button type="button" id="speech-pause" disabled>暂停</button>
    <button type="button" id="speech-stop" disabled>停止</button>
    <output id="speech-time" aria-label="当前句播放时间">0:00 / 0:00</output>
  </div>
  <p class="speech-status" id="speech-status" role="status" aria-live="polite">点击每句旁的 ▶ 收听。英文 Aria，中文晓晓，音频已内嵌。</p>
</section>
